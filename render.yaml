# Render Blueprint: dashboard -> New -> Blueprint -> pick this repo.
# DATABASE_URL is asked for once at creation and never committed.
services:
  - type: web
    name: dining
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -u -m dining.serve --college umd
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
